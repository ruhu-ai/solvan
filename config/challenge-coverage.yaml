  - route: "POST /api/v1/connections/estates"
    operation: estate.connect
  - route: "POST /api/v1/connections/{connection_id}:probe"
    none: "a bounded read-only capability check that grants nothing; it runs under the signed-in administrator's session and current ADMIN role, never a pasted identity token"
  - route: "POST /api/v1/direct-gcp-alert-sources"
    operation: estate.connect
  - route: "POST /api/v1/direct-gcp-pilot:qualify"
