  - route: "DELETE /api/v1/threads/{thread_id}/participants"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "POST /api/v1/threads/{thread_id}/participants"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "PUT /api/v1/threads/{thread_id}/read-cursor"
