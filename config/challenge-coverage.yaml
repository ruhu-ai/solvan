  - route: "POST /api/v1/subscriptions"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "DELETE /api/v1/subscriptions/{subscription_id}"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "POST /api/v1/threads/{thread_id}/access-requests"
