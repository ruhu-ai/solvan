    none: "model context endpoint bound to a service identity, not a person"
  - route: "POST /oauth/enrollment/confirm"
    none: "completes a channel enrollment the operator already authorized"
  - route: "POST /reconciliations"
    none: "service identity: the reconciler reports observed effect and decides nothing"
  - route: "POST /repositories"
    operation: github.bind
  - route: "POST /signer-keys"
    none: "service identity: release signing keys are provisioned, never operator-set"
  - route: "POST /slack/events"
    none: "channel webhook verified by provider signature, never an operator identity"
  - route: "POST /targets"
    none: "service identity: deployment targets are declared by release configuration"
  - route: "POST /v1/admin/connection-pool:recycle"
    none: "the payments fixture's own admin surface; it is not part of the control plane"
  - route: "POST /v1/synthetic/payments"
    none: "the payments fixture generates synthetic load and touches no customer estate"
  - route: "POST /verifier-keys"
    none: "service identity: verification keys are provisioned, never operator-set"
  - route: "POST /{definition_id}:revoke"
    none: "service identity: a provider revokes its own definition, not an operator's"
  - route: "POST /{request_id}/decisions"
    operation: action.approve
  # Approving a publication puts words into a public thread under Solvan's
  # identity. That is an approval in the same sense a pull-request decision is,
  # and it is irreversible in the way that matters: a deleted comment was still
  # read, quoted, and acted on.
  - route: "POST /actions/{action_id}/decision"
    operation: action.approve
  # Admitting a GitHub login decides who may direct Solvan's attention on a
  # repository, so it is bound to the same authority that binds the repository.
  - route: "POST /repositories/{repository_id}/participants"
    operation: github.bind
  # Binding every repository an installation reaches, investigate-only. It
  # grants no GitHub write, but it does give Solvan read reach over private
  # code, which is an administrator's decision.
  # Beginning an install re-authenticates before the operator leaves for
  # GitHub, because the redirect that returns cannot carry a challenge.
  - route: "POST /installations:begin"
    operation: github.bind
  - route: "POST /installations/{installation_id}:connect-all"
    operation: github.bind
  # Changing what one bound repository may do. The challenge is bound to the
  # exact authority, so a page altered while the operator re-authenticates
  # cannot reuse it.
  - route: "POST /repositories/{repository_id}/authority"
    operation: github.bind
