# Which mutating routes require a step-up challenge (specification 05 §4.2).
#
# "Every consequential operation" is prose no test can fail. Every mutating
# route is listed here with either the enumerated operation it requires or an
# explicit reason it requires none. A new route that is neither is a gate
# failure, so the classification is made deliberately rather than by omission.
#
# `operation` names an entry in solvan.application.action_challenge.
# `none` carries the reason, because "no challenge" is a claim about what the
# route can do and must be defensible on its face.

routes:
  - route: "POST /api/admin/operators/invitations"
    operation: role.grant
  - route: "DELETE /api/admin/operators/invitations/{invitation_id}"
    operation: role.grant
  - route: "POST /api/admin/guidance/drafts"
    operation: guidance.author
  - route: "POST /api/admin/guidance/{key}/revisions/{version}/approve"
    operation: guidance.approve
  - route: "POST /api/admin/guidance/{key}/revisions/{version}/deprecate"
    operation: guidance.lifecycle
  - route: "POST /api/admin/guidance/{key}/revisions/{version}/evaluations"
    operation: guidance.author
  - route: "POST /api/admin/guidance/{key}/revisions/{version}/retire"
    operation: guidance.lifecycle
  - route: "POST /api/admin/guidance/{key}/revisions/{version}/submit"
    operation: guidance.author
  - route: "POST /api/admin/trigger-policies/drafts"
    operation: trigger_policy.author
  - route: "POST /api/admin/trigger-policies/{key}/heads/activate"
    operation: trigger_policy.activate
  - route: "POST /api/admin/trigger-policies/{key}/heads/deactivate"
    operation: trigger_policy.activate
  - route: "POST /api/admin/trigger-policies/{key}/heads/prepare-replacement"
    operation: trigger_policy.activate
  - route: "POST /api/admin/trigger-policies/{key}/revisions/{version}/approve"
    operation: trigger_policy.approve
  - route: "POST /api/admin/trigger-policies/{key}/revisions/{version}/evaluations"
    operation: trigger_policy.author
  - route: "POST /api/admin/trigger-policies/{key}/revisions/{version}/mark-eligible"
    operation: trigger_policy.author
  - route: "POST /api/admin/trigger-policies/{key}/revisions/{version}/retire"
    operation: trigger_policy.activate
  - route: "POST /api/alerts/{alert_episode_id}/feedback"
    none: "records an operator opinion and changes no workflow state"
  - route: "POST /api/alerts/{alert_episode_id}/request-incident-continuation"
    operation: alert.command
  - route: "POST /api/alerts/{alert_episode_id}/request-retriage"
    operation: alert.command
  - route: "POST /authorize"
    none: "the development identity provider's own account picker; it is a separate local service that grants nothing in Solvan"
  - route: "POST /operator-step-up-messages"
    none: "the bearer-protected loopback mailbox fixture records test delivery only; it is absent from every deployment and grants no Solvan authority"
  - route: "POST /token"
    none: "the development identity provider's own token endpoint; it issues assertions Solvan then verifies like any other issuer's"
  - route: "POST /api/auth/step-up"
    none: "freezes an action and delivers a bound presence code; it grants no action authority"
  - route: "POST /api/auth/step-up/verify"
    none: "consumes presence, rotates the session, and issues the exact challenge; the later protected route atomically spends that challenge"
  - route: "POST /api/auth/logout"
    none: "ends or begins the caller's own session and confers no authority"
  - route: "POST /api/fleet/alert-policy-simulations"
    operation: alert.policy.simulate
  - route: "POST /api/internal/alert-sources/cloud-monitoring/pubsub-push/{connection_id}"
    none: "service identity: an OIDC-bound worker or provider push, never an operator"
  - route: "POST /api/v1/actuators"
    operation: estate.connect
  - route: "DELETE /api/v1/channels/bindings/{binding_id}"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "POST /api/v1/channels/enrollments"
    none: "conversational: reads durable projections and creates no durable authority"
  - route: "DELETE /api/v1/channels/enrollments/{challenge_id}"
    none: "conversational: reads durable projections and creates no durable authority"
