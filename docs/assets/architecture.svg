<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Solvan governed enterprise agent fleet architecture</title>
  <desc id="description">A Google Cloud architecture in which Cloud SQL owns durable workflow state, a deterministic coordinator dispatches a six-agent regional ADK fleet and an optional public-synthetic Antigravity SDK workspace through governed provider boundaries, and separate injector and oracle identities grade the synthetic payments workload.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .group-title { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; letter-spacing: .02em; }
      .group-note { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .node-title { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .node-copy { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .inverse-title { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .inverse-copy { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #dbeafe; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .edge-dash { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .edge-label { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#canvas)"/>
  <rect x="0" y="0" width="1600" height="8" fill="url(#brand)"/>
  <text x="64" y="65" class="title">Solvan · Fortified Enterprise Fleet</text>
  <text x="64" y="94" class="subtitle">Durable production-outcome control plane · Google Cloud europe-west1 · coordinator-only agent dispatch</text>

  <rect x="52" y="126" width="1496" height="716" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>

  <!-- Inputs -->
  <rect x="78" y="158" width="235" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="188" class="group-title">Signals &amp; operators</text>
  <text x="98" y="207" class="group-note">Authenticated ingress only</text>
  <rect x="98" y="230" width="195" height="58" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="254" class="node-title">Cloud Monitoring</text>
  <text x="115" y="273" class="node-copy">Alert webhook · secondary</text>
  <rect x="98" y="303" width="195" height="58" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="327" class="node-title">Scheduler + detector</text>
  <text x="115" y="346" class="node-copy">0s / 25s / 50s evaluator</text>

  <rect x="78" y="410" width="235" height="192" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="440" class="group-title">Operator surface</text>
  <text x="98" y="459" class="group-note">Never an authority boundary</text>
  <rect x="98" y="482" width="195" height="88" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="115" y="507" class="node-title">Solvan Console</text>
  <text x="115" y="527" class="node-copy">Incident · Case · Fleet</text>
  <text x="115" y="545" class="node-copy">Exact approval · Release proof</text>

  <!-- Durable core -->
  <rect x="345" y="158" width="385" height="444" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="365" y="188" class="group-title">Durable control plane · Cloud Run</text>
  <text x="365" y="207" class="group-note">Deterministic state, leases, budgets, and policy</text>
  <rect x="370" y="230" width="335" height="66" rx="11" fill="url(#brand)"/>
  <text x="389" y="255" class="inverse-title">API + canonical event ingress</text>
  <text x="389" y="276" class="inverse-copy">Scoped projections · human identity verification</text>
  <rect x="370" y="315" width="335" height="78" rx="11" fill="#ffffff" stroke="#60a5fa"/>
  <text x="389" y="341" class="node-title">Durable coordinator</text>
  <text x="389" y="361" class="node-copy">Commits plan before dispatch · fences attempts</text>
  <text x="389" y="379" class="node-copy">Only component that invokes Runtime agents</text>
  <rect x="370" y="412" width="160" height="74" rx="11" fill="#ffffff" stroke="#60a5fa"/>
  <text x="389" y="438" class="node-title">Pub/Sub</text>
  <text x="389" y="458" class="node-copy">Wake-ups only</text>
  <rect x="545" y="412" width="160" height="74" rx="11" fill="#ffffff" stroke="#60a5fa"/>
  <text x="564" y="438" class="node-title">Cloud SQL</text>
  <text x="564" y="458" class="node-copy">61-table truth</text>
  <rect x="370" y="505" width="335" height="70" rx="11" fill="#ffffff" stroke="#60a5fa"/>
  <text x="389" y="531" class="node-title">Inbox · outbox · leases · reservations</text>
  <text x="389" y="551" class="node-copy">Multi-week cases survive every process/runtime restart</text>

  <!-- Agent platform -->
  <rect x="762" y="158" width="485" height="444" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="782" y="188" class="group-title">Gemini Enterprise Agent Platform</text>
  <text x="782" y="207" class="group-note">Regional ADK fleet · optional SDK-backed Antigravity workspace</text>
  <rect x="787" y="230" width="202" height="62" rx="11" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="806" y="255" class="node-title">Agent Registry</text>
  <text x="806" y="275" class="node-copy">Publish · version · discover</text>
  <rect x="1005" y="230" width="217" height="62" rx="11" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="1024" y="255" class="node-title">Memory Bank</text>
  <text x="1024" y="275" class="node-copy">Exact-scope · non-authoritative</text>
  <rect x="787" y="310" width="435" height="207" rx="12" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="806" y="338" class="node-title">Agent Runtime · bounded asynchronous query jobs</text>
  <rect x="806" y="358" width="190" height="46" rx="9" fill="#ede9fe"/>
  <text x="821" y="386" class="node-title">Incident Supervisor Agent</text>
  <rect x="1012" y="358" width="190" height="46" rx="9" fill="#ede9fe"/>
  <text x="1027" y="386" class="node-title">Evidence Agent</text>
  <rect x="806" y="416" width="190" height="46" rx="9" fill="#ede9fe"/>
  <text x="821" y="444" class="node-title">Infrastructure Agent</text>
  <rect x="1012" y="416" width="190" height="46" rx="9" fill="#ede9fe"/>
  <text x="1027" y="444" class="node-title">Execution Agent</text>
  <rect x="806" y="474" width="190" height="28" rx="8" fill="#ede9fe"/>
  <text x="821" y="493" class="node-copy">Verification Agent</text>
  <rect x="1012" y="474" width="190" height="28" rx="8" fill="#ede9fe"/>
  <text x="1027" y="493" class="node-copy">Workspace Agent</text>
  <rect x="787" y="535" width="435" height="40" rx="9" fill="#312e81"/>
  <text x="806" y="560" class="inverse-title">Agent Observability · W3C trace + OTel audit correlation</text>

  <!-- Governance -->
  <rect x="1278" y="158" width="244" height="444" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1298" y="188" class="group-title">Zero-trust governance</text>
  <text x="1298" y="207" class="group-note">Fail closed · typed boundaries</text>
  <rect x="1298" y="230" width="204" height="68" rx="10" fill="#ffffff" stroke="#f97316"/>
  <text x="1316" y="255" class="node-title">Agent Identity</text>
  <text x="1316" y="275" class="node-copy">Six attested principals</text>
  <rect x="1298" y="316" width="204" height="76" rx="10" fill="#ffffff" stroke="#f97316"/>
  <text x="1316" y="341" class="node-title">Agent Gateway</text>
  <text x="1316" y="361" class="node-copy">Registered routes only</text>
  <text x="1316" y="378" class="node-copy">Direct bypass denied</text>
  <rect x="1298" y="410" width="204" height="76" rx="10" fill="#ffffff" stroke="#f97316"/>
  <text x="1316" y="435" class="node-title">Model Armor</text>
  <text x="1316" y="455" class="node-copy">Injection · URI · PII</text>
  <text x="1316" y="472" class="node-copy">Safe continuation</text>
  <rect x="1298" y="504" width="204" height="70" rx="10" fill="#ffffff" stroke="#f97316"/>
  <text x="1316" y="530" class="node-title">Regional policy</text>
  <text x="1316" y="550" class="node-copy">europe-west1 · least privilege</text>

  <!-- Workload and harness -->
  <rect x="345" y="630" width="902" height="184" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="365" y="660" class="group-title">Typed production-data boundary · isolated synthetic payments workload</text>
  <text x="365" y="679" class="group-note">Models never receive cloud credentials or arbitrary mutation tools</text>
  <rect x="370" y="702" width="190" height="76" rx="11" fill="#ffffff" stroke="#22c55e"/>
  <text x="389" y="728" class="node-title">Evidence Broker</text>
  <text x="389" y="748" class="node-copy">Bounded metrics/logs/traces</text>
  <text x="389" y="765" class="node-copy">GCS evidence objects</text>
  <rect x="580" y="702" width="190" height="76" rx="11" fill="#ffffff" stroke="#22c55e"/>
  <text x="599" y="728" class="node-title">Private Actuator</text>
  <text x="599" y="748" class="node-copy">Stored action ID only</text>
  <text x="599" y="765" class="node-copy">Revalidate · execute · reconcile</text>
  <rect x="790" y="702" width="190" height="76" rx="11" fill="#ffffff" stroke="#22c55e"/>
  <text x="809" y="728" class="node-title">Payments API</text>
  <text x="809" y="748" class="node-copy">Pool recycle admin</text>
  <text x="809" y="765" class="node-copy">Cloud Run traffic rollback</text>
  <rect x="1000" y="702" width="222" height="76" rx="11" fill="#ffffff" stroke="#22c55e"/>
  <text x="1019" y="728" class="node-title">Independent Verifier</text>
  <text x="1019" y="748" class="node-copy">Policy-owned signals + probe</text>
  <text x="1019" y="765" class="node-copy">Connector success is not recovery</text>

  <rect x="1278" y="630" width="244" height="184" rx="16" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1298" y="660" class="group-title">Release harness</text>
  <text x="1298" y="679" class="group-note">Outside agent trust boundary</text>
  <rect x="1298" y="702" width="94" height="76" rx="10" fill="#ffffff" stroke="#ef4444"/>
  <text x="1313" y="729" class="node-title">Injector</text>
  <text x="1313" y="750" class="node-copy">Fault only</text>
  <rect x="1408" y="702" width="94" height="76" rx="10" fill="#ffffff" stroke="#ef4444"/>
  <text x="1424" y="729" class="node-title">Oracle</text>
  <text x="1424" y="750" class="node-copy">Grades only</text>

  <!-- Edges -->
  <path d="M293 259 H338 V263 H370" class="edge"/>
  <path d="M293 332 H338 V275 H370" class="edge"/>
  <path d="M293 526 H335 V262 H370" class="edge-blue"/>
  <text x="302" y="511" class="edge-label">read + exact approval</text>
  <path d="M537 296 V315" class="edge-blue"/>
  <path d="M537 393 V412" class="edge"/>
  <path d="M625 393 V412" class="edge-blue"/>
  <path d="M705 353 H748 V408 H787" class="edge-blue"/>
  <text x="709" y="340" class="edge-label">typed plan / dispatch</text>
  <path d="M787 261 H744 V354 H705" class="edge"/>
  <path d="M1005 292 V310" class="edge-dash"/>
  <path d="M1222 408 H1262 V354 H1298" class="edge"/>
  <path d="M1298 448 H1262 V449 H1222" class="edge"/>
  <path d="M1107 462 V612 H465 V702" class="edge-blue"/>
  <text x="753" y="620" class="edge-label">governed typed tools</text>
  <path d="M1107 462 V620 H675 V702" class="edge-blue"/>
  <path d="M770 740 H790" class="edge-blue"/>
  <path d="M980 740 H1000" class="edge"/>
  <path d="M1392 740 H1222" class="edge-dash"/>
  <path d="M1408 758 H1222" class="edge-dash"/>

  <text x="64" y="874" class="subtitle">Authority path: telemetry → durable coordinator → governed agent attempt → stored action → private actuator → independent verification → multi-day Reliability Case</text>
</svg>
