services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: solvan_local
      POSTGRES_USER: solvan_local
      POSTGRES_PASSWORD: solvan_local_only
    ports:
      - "127.0.0.1:${SOLVAN_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvan_local -d solvan_local"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: {}

