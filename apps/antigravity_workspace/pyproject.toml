[project]
name = "solvan-antigravity-workspace-runtime"
version = "0.1.0"
description = "Isolated dependency closure for the public-synthetic Antigravity provider"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "google-antigravity==0.1.13",
  "google-auth==2.56.3",
  "httpx==0.28.1",
  "opentelemetry-api==1.42.1",
  "opentelemetry-exporter-gcp-logging==1.14.0a0",
  "opentelemetry-exporter-gcp-trace==1.14.0",
  "opentelemetry-sdk==1.42.1",
  "pydantic==2.12.5",
  "requests==2.34.2",
  "rfc8785==0.1.4",
  "uvicorn==0.46.0",
]

[tool.uv]
package = false
