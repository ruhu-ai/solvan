steps:
  - id: verify-release-commit
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        test -n "${COMMIT_SHA}"
        test "${COMMIT_SHA}" = "${_RELEASE_COMMIT}"
        test "$(git rev-parse HEAD)" = "${_RELEASE_COMMIT}"
  - id: pull-python-layer-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/python-layer-cache:${_PYTHON_CACHE_TAG}" || true
  - id: build-alert-ingress
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.python
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/python-layer-cache:${_PYTHON_CACHE_TAG}
      - --build-arg=APP_MODULE=apps.alert_ingress.main:app
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/alert-ingress:${BUILD_ID}
      - .
  - id: build-direct-gcp-reader
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.python
      - --build-arg=APP_MODULE=apps.direct_gcp_reader.main:app
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/direct-gcp-reader:${BUILD_ID}
      - .
  - id: build-pilot-qualification-verifier
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.python
      - --build-arg=APP_MODULE=apps.pilot_qualification_verifier.main:app
