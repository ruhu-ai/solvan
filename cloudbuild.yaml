      - .
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.python
      - --build-arg=APP_MODULE=apps.api.main:app
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${BUILD_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/python-layer-cache:${_PYTHON_CACHE_TAG}
      - .
  - id: build-coordinator
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.python
      - --build-arg=APP_MODULE=apps.coordinator.main:app
