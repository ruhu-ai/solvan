serviceAccount: projects/${PROJECT_ID}/serviceAccounts/solvan-build@${PROJECT_ID}.iam.gserviceaccount.com
substitutions:
  _REGION: europe-west1
  _REPOSITORY: solvan
  _RELEASE_COMMIT: UNCONFIGURED
  _PYTHON_CACHE_TAG: v1
options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  requestedVerifyOption: VERIFIED
timeout: 2400s
