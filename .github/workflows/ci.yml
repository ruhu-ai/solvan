name: repository-harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.5.0"
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: Bootstrap
        run: scripts/bootstrap --ci
      - name: Canonical check
        run: scripts/check
      - name: Upload browser and harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            .solvan/dev/*/evals/
            .solvan/dev/*/observability/
