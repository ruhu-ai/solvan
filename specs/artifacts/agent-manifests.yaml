optional_agents:
  - agent_key: liaison-agent
    display_name: Liaison Agent
    registry_kind: AGENT
    execution_role: SPECIALIST
    implementation_status: IMPLEMENTED
    application_module: solvan.application.liaison.adk_composer
    service_modules:
      - apps.api.main
      - apps.liaison_maintenance.main
    enable_env: SOLVAN_ENABLE_CONVERSATIONAL_SURFACE
    platform: cloud-run
    framework: google-adk
    framework_version: 2.5.0
    identity_type: WORKLOAD_IDENTITY
    immutable_resource_env: SOLVAN_LIAISON_REGISTRY_RESOURCE
    location: europe-west1
    model_location: eu
    model_endpoint: https://aiplatform.eu.rep.googleapis.com
    model_resource: gemini-3.6-flash
    owner_department: sre-platform
    discoverable_by: [sre, platform, security, compliance, ai-platform]
    capabilities:
      - conversation.read.delegated-projection
      - conversation.write.ledger
      - coordinator.steer.propose
    tools:
      - resolve_anchor
      - read_projection
      - list_prior_incidents
      - search_records
      - catch_up
      - recall_conversation
      - recall_memory
      - ask_principal
      - steer_draft
    data_classes: [INTERNAL, CONFIDENTIAL]
    authority_ceiling:
      reads: DELEGATED_PROJECTIONS_ONLY
      writes: CONVERSATION_ROWS_ONLY
      proposes: STEER_VIA_COORDINATOR_INBOX
    prohibited_capabilities:
      - telemetry.read.direct
      - connector.invoke.direct
      - production.mutate
      - agent.dispatch
      - action.approve
      - verification.adjudicate
      - incident.resolve
      - case.close
      - memory.promote
    registry_behavior: REGISTER_ONLY_WHEN_ENABLED
    release_stage: TARGET
    approval_status: PENDING_DEPLOYMENT_EVIDENCE
    lifecycle: DISABLED_BY_DEFAULT
  - agent_key: antigravity-incident-workspace
    display_name: Antigravity Incident Workspace Agent
    registry_kind: AGENT
    execution_role: WORKSPACE_PROVIDER
    implementation_status: IMPLEMENTED
    provider_module: solvan.platform.antigravity_workspace
    service_module: apps.antigravity_workspace.main
    enable_env: SOLVAN_ENABLE_ANTIGRAVITY_DEMO
    platform: cloud-run
    workspace_provider: AntigravityWorkspaceProvider
    implementation_sdk: google-antigravity
    implementation_sdk_version: 0.1.10
    hosting_control_plane: cloud-run
    hosting_data_plane: private-https
    immutable_resource_env: SOLVAN_ANTIGRAVITY_WORKSPACE_SERVICE
    location: europe-west1
    model_location: global
    model_resource: gemini-3.1-pro-preview
    owner_department: application-engineering
    discoverable_by: [sre, application-engineering, ai-platform]
    capabilities:
      - incident.deep-investigation.propose
      - repository.patch.propose
      - regression-test.propose
    tools:
      - workspace_read_artifact
      - workspace_write_candidate
    data_classes: [PUBLIC]
    synthetic_attestation_required: true
    permission_ceiling: PUBLIC_SYNTHETIC_EXPERIMENT_ONLY
    prohibited_capabilities:
      - root-cause.confirm
      - patch.approve
      - repository.merge
      - deployment.execute
      - production.mutate
      - verification.adjudicate
      - incident.resolve
      - case.close
      - memory.promote
      - production-graph.approve
    registry_behavior: REGISTER_ONLY_WHEN_ENABLED
    release_stage: ALPHA_SDK
    approval_status: EXPERIMENT_ONLY
    lifecycle: DISABLED_BY_DEFAULT

# Deterministic seats hold capability that no model-backed agent may hold.
# They are registered because PR-031 requires every governed destination to be
# catalogued, and because the fleet's security claim is only legible when the
# one component that can mutate production is visible beside the six that
# cannot. They carry no model by design: their value is that they cannot be
# persuaded, only satisfied.
deterministic_services:
  - service_key: action-actuator
    display_name: Action Actuator
    registry_kind: DETERMINISTIC_SERVICE
    implementation_status: IMPLEMENTED
    app_module: apps.actuator.main
    immutable_resource_env: SOLVAN_ACTUATOR_URL
    owner_department: sre-platform
    discoverable_by: [sre, platform, security, compliance]
    model_backed: false
    identity_type: WORKLOAD_IDENTITY
    caller_ceiling: EXECUTION_AGENT_IDENTITY_ONLY
    permission_ceiling: PRODUCTION_MUTATION_ALLOWLIST_ONLY
    allowed_operations:
      - PAYMENTS_POOL_RECYCLE
      - CLOUD_RUN_TRAFFIC_ROLLBACK
    accepts_from_caller:
      - action_id
      - scope
      - invocation_id
      - trace_id
    prohibited_capabilities:
      - action.author
      - approval.grant
      - policy.evaluate-weaker
      - verification.adjudicate
      - incident.resolve
      - case.close
    preconditions_revalidated:
      - stored_action_digest
      - approval_validity_and_expiry
      - target_version_and_epoch
      - policy_version
      - target_reservation
    approval_status: PENDING_DEPLOYMENT_EVIDENCE
    lifecycle: DRAFT
